# fly.toml app configuration file generated for atproto_pds_ws_server
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "atproto-pds-ws-server"
primary_region = "iad"

[build]

[env]
PORT = "8080"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]

# WebSocket configuration
[http_service.concurrency]
type = "connections"
hard_limit = 1000
soft_limit = 500

# Health check to ensure the machine stays up
[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
timeout = "5s"
path = "/"
